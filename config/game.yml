%YAML:1.0
---
# 鼠标预览与两种手部评分共用参数；不是正式实验条件。
# 16:9 横向画布，在 2560x1440 屏幕等比放大 2 倍；其他比例居中补黑边。
width: 1280
height: 720
# 参与者在相机对面：旋转 180 度，横向宽幅；0 为原方向，90 为之前的侧向布局。
output_rotation_ccw: 180
# 命中圈半径；170 为原来 85 的两倍，目标图案和观测位置随之调整。
hit_radius: 170
# 恢复地鼠图案；square 可用于排查图案误检，两种评分必须使用相同图案。
target_style: mole
# 地鼠亮度百分比 10～100；运行时左右箭头每次调 10%，预览立即生效，计分模式下回合生效。
# 当前实机初步反馈：50% 及以下手框较稳，60% 开始闪烁；两种模式先统一用 50%。
target_brightness: 50
# 当前只显示地鼠，直接检测中心颜色；1 可启用两侧同步标记。
state_markers: 0
# 显示时长：50～10000 ms；上下键只修改后续试次。
display_ms: 500
# 随机等待：最小 100 ms，最大不超过 60000 ms。
wait_min_ms: 1000
wait_max_ms: 5000
# 每次击打或超时后的反馈时长：100～10000 ms。
feedback_ms: 600
# 相机输入最大间隔/延迟，以及显示结束后等待在途结果的上限。
input_timeout_ms: 200
# 相机评分：内部隐藏后，等待观测到实际消失的上限；超限记 UNJUDGED。
# 不是延长地鼠可见状态；每次命中仍要求同帧 VISIBLE。
observation_timeout_ms: 1000
